<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Checkout Terminal</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f5f5f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; box-sizing: border-box; }
        h2 { color: #1d1d1f; margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { font-size: 14px; color: #86868b; font-weight: 600; display: block; margin-bottom: 8px; }
        input { width: 100%; padding: 12px; border: 1px solid #d2d2d7; border-radius: 10px; font-size: 16px; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #0071e3; }
        button { width: 100%; padding: 14px; background-color: #0071e3; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #0077ed; }
        .total-display { font-size: 48px; font-weight: 700; color: #1d1d1f; margin: 20px 0; }
        .status-msg { font-size: 16px; color: #1d1d1f; margin: 20px 0; font-weight: 500; }
        .discount-badge { display: inline-block; background-color: #34c759; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card" id="terminal">
    <!-- Step 1: Clerk Input -->
    <div id="step-clerk">
        <h2>Merchant Terminal</h2>
        <div class="input-group">
            <label for="amount">Enter Transaction Amount ($)</label>
            <input type="number" id="amount" step="0.01" placeholder="0.00" autofocus>
        </div>
        <button onclick="submitAmount()">Turn Tablet to Customer</button>
    </div>

    <!-- Step 2: Customer Rewards Lookup -->
    <div id="step-rewards" style="display: none;">
        <h2>Welcome!</h2>
        <div class="input-group">
            <label for="phone">Enter Phone Number for Rewards</label>
            <input type="tel" id="phone" placeholder="715-555-5555">
        </div>
        <button onclick="checkRewards()">Verify Rewards</button>
    </div>

    <!-- Step 3: Total Screen & Customer Confirms -->
    <div id="step-total" style="display: none;">
        <h2 id="total-title">Your Total</h2>
        <div id="badge-container"></div>
        <div class="total-display" id="display-amount">$0.00</div>
        <button onclick="proceedToPayment()">Confirm & Pay</button>
    </div>

    <!-- Step 4: Hardware Prompt -->
    <div id="step-card" style="display: none;">
        <h2>Payment Terminal</h2>
        <div class="status-msg">Please insert, swipe, or tap your card now...</div>
        <button onclick="finishTransaction()">Done</button>
    </div>
</div>

<script>
    let originalPrice = 0;
    let finalPrice = 0;

    // Active rewards lists mapped by phone numbers
    const rewards = {
        "7152229595": { type: "percent", value: 50, label: "50% OFF Rewards Club" },
        "7154103101": { type: "flat", value: 10, label: "$10 OFF Loyal Customer" },
        "7158028977": { type: "flat", value: 10, label: "$10 OFF Loyal Customer" }
    };

    function submitAmount() {
        const amtInput = document.getElementById('amount').value;
        if (!amtInput || parseFloat(amtInput) <= 0) {
            alert("Please enter a valid amount.");
            return;
        }
        originalPrice = parseFloat(amtInput);
        document.getElementById('step-clerk').style.display = 'none';
        document.getElementById('step-rewards').style.display = 'flex';
        document.getElementById('step-rewards').style.direction = 'column';
        document.getElementById('step-rewards').style.display = 'block';
        document.getElementById('phone').focus();
    }

    function checkRewards() {
        const rawPhone = document.getElementById('phone').value.replace(/\D/g, '');
        const badgeContainer = document.getElementById('badge-container');
        badgeContainer.innerHTML = ''; 

        if (rewards[rawPhone]) {
            const reward = rewards[rawPhone];
            if (reward.type === "percent") {
                finalPrice = originalPrice * (1 - (reward.value / 100));
            } else if (reward.type === "flat") {
                finalPrice = Math.max(0, originalPrice - reward.value);
            }
            
            const badge = document.createElement('div');
            badge.className = 'discount-badge';
            badge.innerText = reward.label;
            badgeContainer.appendChild(badge);
            document.getElementById('total-title').innerText = "Rewards Applied!";
        } else {
            finalPrice = originalPrice;
            document.getElementById('total-title').innerText = "No Rewards Found";
        }

        document.getElementById('display-amount').innerText = "$" + finalPrice.toFixed(2);
        document.getElementById('step-rewards').style.display = 'none';
        document.getElementById('step-total').style.display = 'block';
    }

    function proceedToPayment() {
        document.getElementById('step-total').style.display = 'none';
        document.getElementById('step-card').style.display = 'block';
    }

    function finishTransaction() {
        // Reset terminal back to beginning
        document.getElementById('amount').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('step-card').style.display = 'none';
        document.getElementById('step-clerk').style.display = 'block';
        originalPrice = 0;
        finalPrice = 0;
    }
</script>

</body>
</html>
